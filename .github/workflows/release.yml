name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SONOS_MACBAR_VERSION="$VERSION" bash scripts/package_release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_PATH="dist/Sonos-Macbar-${VERSION}.zip"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE_PATH" \
            --title "Sonos Macbar ${VERSION}" \
            --notes-file RELEASE_NOTES.md
